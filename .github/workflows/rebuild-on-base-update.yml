name: Rebuild on base image update

on:
  push:
    branches: [main]
    paths: [Dockerfile]

concurrency:
  group: rebuild-on-base-update
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    # Only rebuild the released version when nothing but the debian FROM
    # lines changed. Other Dockerfile changes wait for the next release.
    - name: Check that only the base image changed
      id: check
      run: |
        other=$(git diff -U0 "${{ github.event.before }}" "${{ github.sha }}" -- Dockerfile \
          | grep -E '^[-+]' | grep -v -E '^(\+\+\+|---) ' | grep -v -E '^[-+]FROM debian:' || true)
        if [ -n "$other" ]; then
          echo "::notice::Dockerfile has other changes, not rebuilding the released version"
          echo "rebuild=false" >> "$GITHUB_OUTPUT"
        else
          echo "rebuild=true" >> "$GITHUB_OUTPUT"
        fi
    # Rebuild the version currently published as "latest" on Docker Hub.
    - name: Find latest version
      if: steps.check.outputs.rebuild == 'true'
      id: version
      run: |
        hub=https://hub.docker.com/v2/repositories/dovecot/dovecot/tags
        digest=$(curl -sf "$hub/latest" | jq -r '.digest // empty')
        [ -n "$digest" ] || { echo "::error::Could not read the digest of latest"; exit 1; }
        version=$(curl -sf "$hub?page_size=100" \
          | jq -r --arg d "$digest" '.results[] | select(.digest == $d and (.name | test("^[0-9]+(\\.[0-9]+)+$"))) | .name')
        [ "$(echo "$version" | wc -w)" -eq 1 ] || { echo "::error::Expected one version tag for latest, got: '$version'"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Start build
      if: steps.check.outputs.rebuild == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh workflow run docker-image.yml --repo "${{ github.repository }}" --ref main \
          -f version=${{ steps.version.outputs.version }} -f config_version=1.0.0 \
          -f latest=true -f publish=true
